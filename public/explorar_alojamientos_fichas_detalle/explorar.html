<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<title>Explorar Alojamientos - Tu Refugio</title>
  <link rel="stylesheet" href="explorar.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/global.css" />
  <link rel="stylesheet" href="/css/chatbot-float.css" />
</head>
<body>
  <header>
    <div class="titulo-con-logo">
      <img src="logo.png" alt="" class="logo-principal">
      <h1 class="titulo-principal">Tu Refugio</h1>
    </div>
    <nav class="nav-centered">
      <ul class="menu">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="#">Registro</a>
          <ul>
            <li><a href="../registro_turista/turista.html">Turista</a></li>
            <li><a href="../registro_anfitrion/anfitrion.html">Anfitrión</a></li>
          </ul>
        </li>
        <li><a href="../login/login.html">Iniciar Sesión</a></li>
        <li><a href="#">Explorar Alojamientos</a>
          <ul>
            
            <li><a href="../calificar_reseñar/calificar.html">Calificar / Reseñar</a></li>
          </ul>
        </li>
        
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="explorar-layout">
    <section class="formulario">
      <div class="formulario-header">
        <h1>Explorar</h1>
        <span class="formulario-badge">Filtros</span>
      </div>

      <!-- FILTROS AVANZADOS -->
      <div class="filtros-container">

        <!-- Precio -->
        <div class="filtro-grupo">
          <div class="filtro-grupo-titulo">
            <span class="filtro-icono">💰</span>
            <span>Precio por noche</span>
          </div>
          <div class="filtro-precio-wrap">
            <div class="filtro-precio-campo">
              <label for="filtro-precio-min">Mínimo</label>
              <div class="filtro-input-prefix">
                <span>$</span>
                <input type="text" id="filtro-precio-min" placeholder="Ej: 120000" inputmode="numeric" autocomplete="off" pattern="[0-9.,\s]*">
              </div>
            </div>
            <div class="filtro-precio-sep">—</div>
            <div class="filtro-precio-campo">
              <label for="filtro-precio-max">Máximo</label>
              <div class="filtro-input-prefix">
                <span>$</span>
                <input type="text" id="filtro-precio-max" placeholder="Ej: 950 mil" inputmode="numeric" autocomplete="off" pattern="[0-9.,\s]*">
              </div>
            </div>
          </div>
        </div>

        <!-- Ubicación -->
        <div class="filtro-grupo">
          <div class="filtro-grupo-titulo">
            <span class="filtro-icono">📍</span>
            <span>Ubicación</span>
          </div>
          <div class="filtro-item">
            <label for="filtro-ubicacion">Ciudad o región</label>
            <input type="text" id="filtro-ubicacion" placeholder="Ej: Bogotá, Cartagena…">
          </div>
          <div class="filtro-item">
            <label for="filtro-zona">Tipo de zona</label>
            <select id="filtro-zona">
              <option value="">Todas las zonas</option>
              <option value="rural">🌿 Rural</option>
              <option value="residencial">🏡 Residencial</option>
              <option value="urbana">🏙️ Urbana</option>
              <option value="comercial">🏪 Comercial</option>
              <option value="industrial">🏭 Industrial</option>
            </select>
          </div>
          <div class="filtro-item">
            <label for="filtro-cercania">Cercanía</label>
            <input type="text" id="filtro-cercania" placeholder="Ej: playa, centro, montaña…">
          </div>
        </div>

        <!-- Ambiente -->
        <div class="filtro-grupo">
          <div class="filtro-grupo-titulo">
            <span class="filtro-icono">🌄</span>
            <span>Ambiente</span>
          </div>
          <div class="filtro-item">
            <label for="filtro-vistas">Vistas</label>
            <select id="filtro-vistas">
              <option value="">Cualquier vista</option>
              <option value="mar">🌊 Mar</option>
              <option value="montaña">⛰️ Montaña</option>
              <option value="ciudad">🏙️ Ciudad</option>
              <option value="jardín">🌻 Jardín</option>
              <option value="ninguna">— Ninguna</option>
            </select>
          </div>
          <div class="filtro-item">
            <label for="filtro-servicios">Servicios incluidos</label>
            <input type="text" id="filtro-servicios" placeholder="Ej: wifi, piscina, gym…">
          </div>
        </div>

        <!-- Calificación -->
        <div class="filtro-grupo">
          <div class="filtro-grupo-titulo">
            <span class="filtro-icono">⭐</span>
            <span>Calificación mínima</span>
          </div>
          <div class="filtro-estrellas-wrap">
            <div class="filtro-estrellas" id="filtroEstrellas">
              <button type="button" class="estrella" data-val="1" title="1 estrella">★</button>
              <button type="button" class="estrella" data-val="2" title="2 estrellas">★</button>
              <button type="button" class="estrella" data-val="3" title="3 estrellas">★</button>
              <button type="button" class="estrella" data-val="4" title="4 estrellas">★</button>
              <button type="button" class="estrella" data-val="5" title="5 estrellas">★</button>
            </div>
            <span class="filtro-estrellas-label" id="filtroEstrellasLabel">Cualquiera</span>
          </div>
          <!-- input oculto que el JS ya lee -->
          <input type="hidden" id="filtro-calificacion" value="">
        </div>

        <!-- Acciones -->
        <div class="filtro-acciones">
          <button id="btnFiltrar" class="btn-filtrar">🔍 Aplicar filtros</button>
          <button id="btnLimpiar" class="btn-limpiar">↺ Limpiar</button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN DE ALOJAMIENTOS EXPLORADOS -->
    <section id="explorarAlojamientos">
      <div id="cardsExplorar" class="grid-cards">
        <!-- Alojamientos se cargarán dinámicamente aquí -->
      </div>
    </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p></p>
    </div>
  </footer>






<script src="explorar.js"></script>
<script src="/js/chatbot-float.js"></script>

</body>
</html>
