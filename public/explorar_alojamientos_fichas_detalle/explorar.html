<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explorar Alojamientos - Tu Refugio</title>
  <link rel="stylesheet" href="explorar.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="titulo-con-logo">
      <img src="logo.png" alt="" class="logo-principal">
      <h1 class="titulo-principal">Tu Refugio</h1>
    </div>
    <nav class="nav-centered">
      <ul class="menu">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="#">Registro</a>
          <ul>
            <li><a href="../registro_turista/turista.html">Turista</a></li>
            <li><a href="../registro_anfitrion/anfitrion.html">Anfitrión</a></li>
          </ul>
        </li>
        <li><a href="../login/login.html">Iniciar Sesión</a></li>
        <li><a href="#">Explorar Alojamientos</a>
          <ul>
            
            <li><a href="../calificar_reseñar/calificar.html">Calificar / Reseñar</a></li>
          </ul>
        </li>
        
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="explorar-layout">
    <section class="formulario">
      <h1>Explorar Alojamientos</h1>
      
      <!-- FILTROS AVANZADOS -->
      <div class="filtros-container">
        <h3>🔍 Filtros Avanzados</h3>
        <div class="filtros-grid">
          <div class="filtro-item">
            <label for="filtro-precio-min">💰 Precio mínimo:</label>
            <input type="number" id="filtro-precio-min" placeholder="Desde $" min="0">
          </div>

          <div class="filtro-item">
            <label for="filtro-precio-max">💰 Precio máximo:</label>
            <input type="number" id="filtro-precio-max" placeholder="Hasta $" min="0">
          </div>

          <div class="filtro-item">
            <label for="filtro-servicios">🛎️ Servicios:</label>
            <input type="text" id="filtro-servicios" placeholder="Ej: wifi, piscina">
          </div>

          <div class="filtro-item">
            <label for="filtro-ubicacion">📍 Ubicación:</label>
            <input type="text" id="filtro-ubicacion" placeholder="Ciudad o región">
          </div>

          <div class="filtro-item">
            <label for="filtro-zona">🏞️ Zona:</label>
            <select id="filtro-zona">
              <option value="">Todas</option>
              <option value="rural">Rural</option>
              <option value="residencial">Residencial</option>
              <option value="urbana">Urbana</option>
              <option value="comercial">Comercial</option>
              <option value="industrial">Industrial</option>
            </select>
          </div>

          <div class="filtro-item">
            <label for="filtro-cercania">🚶 Cercanía:</label>
            <input type="text" id="filtro-cercania" placeholder="Ej: cerca a playa, centro">
          </div>

          <div class="filtro-item">
            <label for="filtro-vistas">👀 Vistas:</label>
            <select id="filtro-vistas">
              <option value="">Todas</option>
              <option value="mar">Mar</option>
              <option value="montaña">Montaña</option>
              <option value="ciudad">Ciudad</option>
              <option value="jardín">Jardín</option>
              <option value="ninguna">Ninguna</option>
            </select>
          </div>

          <div class="filtro-item">
            <label for="filtro-calificacion">⭐ Calificación mínima:</label>
            <input type="number" id="filtro-calificacion" placeholder="Min. estrellas" min="1" max="5" step="0.1">
          </div>
        </div>
        <button id="btnFiltrar" class="btn-filtrar">🔎 Aplicar Filtros</button>
        <button id="btnLimpiar" class="btn-limpiar">🔄 Limpiar Filtros</button>
      </div>
    </section>

    <!-- SECCIÓN DE ALOJAMIENTOS EXPLORADOS -->
    <section id="explorarAlojamientos">
      <div id="cardsExplorar" class="grid-cards">
        <!-- Alojamientos se cargarán dinámicamente aquí -->
      </div>
    </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p></p>
    </div>
  </footer>






<script src="explorar.js"></script>

</body>
</html>
